group 'com.gstory.flutter_unionad'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        flatDir {
            dirs project(':flutter_unionad').file('libs')
        }
        maven {
            url 'https://artifact.bytedance.com/repository/pangle'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.gstory.flutter_unionad"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
        consumerProguardFiles 'proguard-rules.pro'
    }

    lint {
        disable += 'InvalidPackage'
    }

}

// 与 compileOptions 的 1.8 保持一致；缺省时 KGP 2.x 会用 17，构建直接报不一致
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.3.1"


    implementation(name: 'open_ad_sdk_7.5.1.0', ext: 'aar')
    //ks
    implementation(name: "mediation_ks_adapter_4.12.20.1.0", ext: 'aar')
    implementation(name: "kssdk-ad-4.12.20.1", ext: 'aar')

    //baidu
    implementation(name: "mediation_baidu_adapter_9.430.0", ext: 'aar')
    implementation(name: "Baidu_MobAds_SDK_v9.430", ext: 'aar')

    //gdt
    implementation(name: "mediation_gdt_adapter_4.670.1540.0", ext: 'aar')
    implementation(name: "GDTSDK.unionNormal.4.670.1540", ext: 'aar')

}
